<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173c31">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="词舟">
  <title>词舟 · 英语考纲背诵</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-route="volumes" aria-label="返回选册"><span class="brand-mark">W</span><span>词舟</span></button>
      <div class="top-actions"><button class="install-button" id="installApp" hidden>安装应用</button><div class="day-chip"><span class="pulse"></span><span id="dateLabel">100 词 / 册</span></div></div>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="主要导航">
      <button data-route="volumes" class="active"><span>▦</span>选册</button>
      <button data-route="library"><span>▤</span>总词库</button>
      <button data-route="roots"><span>⌘</span>词根</button>
      <button data-route="progress"><span>⇅</span>进度</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./vendor/sql-wasm.js"></script>
  <script src="./local-store.js"></script>
  <script src="./browser-progress.js"></script>
  <script src="./app.js"></script>
</body>
</html>
